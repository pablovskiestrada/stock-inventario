<label>SKU <input type="text" name="sku" maxlength="50" required value="{{ product.sku if product else '' }}"></label>
<label>Nombre <input type="text" name="name" maxlength="150" required value="{{ product.name if product else '' }}"></label>
<label>Categoría
  <select name="category_id" required>
    <option value="">Elegí una categoría</option>
    {% for category in categories %}
    <option value="{{ category.id }}"{% if product and product.category_id == category.id %} selected{% endif %}>{{ category.name }}</option>
    {% endfor %}
  </select>
</label>
<label>Precio de costo <input type="text" name="cost_price" inputmode="decimal" required value="{{ '{:.2f}'.format(product.cost_price) if product else '' }}"></label>
<label>Precio de venta <input type="text" name="sale_price" inputmode="decimal" required value="{{ '{:.2f}'.format(product.sale_price) if product else '' }}"></label>
<label>Unidad
  <select name="unit" required>
    {% for code, label in unit_choices %}
    <option value="{{ code }}"{% if product and product.unit == code.value %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</label>
<label>Stock mínimo <input type="text" name="min_stock" inputmode="decimal" value="{{ product.min_stock|quantity(product.unit) if product else 0 }}"></label>
