<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock App{% endblock %}</title>
  <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
  <script>
    // Permite que HTMX muestre los fragmentos de error (409/422) devueltos por el servidor.
    document.addEventListener("htmx:beforeSwap", function (event) {
      var status = event.detail.xhr.status;
      if (status === 409 || status === 422 || status === 404) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });
  </script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    .warning { color: #8a5a00; font-weight: 600; }
    tr.inactive td { color: #777; }
    fieldset { border: 0; padding: 0; margin: 0 0 .5rem; }
    .form-grid label { display: inline-block; margin: 0 .75rem .5rem 0; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: .4rem; border-bottom: 1px solid #ddd; text-align: left; }
    .error { color: #b00020; }
    .empty { color: #666; font-style: italic; }
    a.button { display: inline-block; padding: 1px 6px; border: 1px solid #767676; border-radius: 3px;
               background: #efefef; color: inherit; text-decoration: none; font-size: 13.333px; }
  </style>
</head>
<body>
  <nav>
    <a href="/products">Productos</a>
    <a href="/categories">Categorías</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
